name: Build Mac app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-mac
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust (Apple Silicon + Intel targets)
        run: |
          rustup update stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build Tempo.app and Tempo.dmg (universal)
        run: npx tauri build --target universal-apple-darwin

      - name: Collect the files
        run: |
          mkdir -p out
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg out/Tempo.dmg
          cd src-tauri/target/universal-apple-darwin/release/bundle/macos
          ditto -c -k --keepParent Tempo.app "$GITHUB_WORKSPACE/out/Tempo.app.zip"

      - name: Publish as the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest out/Tempo.dmg out/Tempo.app.zip \
            --target "$GITHUB_SHA" \
            --title "Tempo — latest build" \
            --notes "Built from ${GITHUB_SHA::7} on $(date -u '+%d %b %Y %H:%M UTC'). Download **Tempo.dmg**, open it and drag Tempo into Applications. First launch: see the README."
